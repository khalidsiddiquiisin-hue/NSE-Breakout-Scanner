name: List Qualifying Breakouts

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python3 -u list_qualifying_breakouts.py
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qualifying-breakouts
          path: qualifying_breakouts.csv
