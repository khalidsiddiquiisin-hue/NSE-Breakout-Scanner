name: NSE Breakout Scanner

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols (e.g. RELIANCE,TCS,ITC)"
        required: false
        default: "RELIANCE,TCS,TATASTEEL,HDFCBANK,ITC"
      years:
        description: "Years of history to pull (use a small number like 1-2 for a quick sanity test)"
        required: false
        default: "20"

permissions:
  contents: read   # bump to write later if we add state-file persistence

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCANNER_SYMBOLS: ${{ inputs.symbols }}
          SCANNER_YEARS: ${{ inputs.years }}
        run: python3 resistance_breakout_scanner.py
